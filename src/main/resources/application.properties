spring.application.name=petcare_management

# 1. Cổng chạy ứng dụng Server (Mặc định là 8080)
server.port=8080

# 2. Đường dẫn kết nối đến MySQL (Đã đổi tên db thành 'petcare_management' theo script của bạn)
spring.datasource.url=jdbc:mysql://localhost:3306/petcare_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# 3. Tài khoản và Mật khẩu đăng nhập MySQL trên máy bạn
# (Nếu bạn dùng XAMPP thì password để trống, còn cài MySQL Installer thì điền pass của bạn vào nhé)
spring.datasource.username=root
spring.datasource.password=101001

# 4. Cấu hình Hibernate (Đảm bảo đồng bộ và hiển thị câu lệnh để dễ debug)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =====================================================
# 📸 CẤU HÌNH NÂNG HẠN MỨC DUNG LƯỢNG UPLOAD ẢNH (TỐI ĐA 10MB)
# =====================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB